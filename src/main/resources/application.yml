spring:
  application:
    name: todo-rest-api
  datasource:
    url: jdbc:h2:mem:todo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
